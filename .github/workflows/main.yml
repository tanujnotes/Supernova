name: Build APK and publish

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:
  workflow_call:

permissions: write-all

jobs:
  build-apk:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
                
      - uses: thecodemonkey/action-get-gradle-version@master
        id: gradleversion
        
      - name: Show Grade Version          
        run: | 
          echo gradle version: ${{ steps.gradleversion.outputs.version }}      
         
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

        
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current
          gradle-home-cache-cleanup: true
          
      - name: Build APK
        run: |
            chmod +x gradlew        
            ./gradlew assembleRelease
        
      - name: current dir
        run: | 
            pwd
            ls -la app/build/outputs/apk/release 

      #old - /usr/local/lib/android/sdk/build-tools/
      #new - $ANDROID_HOME/build-tools/
      - name: Setup build tool version variable
        shell: bash
        run: |
         BUILD_TOOL_VERSION=$(ls $ANDROID_HOME/build-tools/ | tail -n 1)
         echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
         echo Last build tool version is: $BUILD_TOOL_VERSION
  
      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release/
          signingKeyBase64: ${{ secrets.KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.PASSWORD }}
          keyPassword: ${{ secrets.PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}
          
      - name: get date/date 
        env:
         TZ: "America/Chicago"
        run: | 
          echo "NOW=$(date +'%m-%d-%Y-%I.%M.%S.%p')" >> $GITHUB_ENV
          
      - name: Output Signed APK
        run:  echo 'Signed APK is ${{ steps.sign_app.outputs.signedReleaseFile }}' 

      - name: Rename release APK
        run: | 
           cp ${{ steps.sign_app.outputs.signedReleaseFile }} ${{ github.event.repository.name }}-${{ env.NOW }}.apk
                  
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NOW }}
          prerelease: false
          draft: false
          body: ${{ github.event.head_commit.message }}
          files: ${{ github.event.repository.name }}-${{ env.NOW }}.apk
          name: "APK Release ${{ env.NOW }}" 
         
      